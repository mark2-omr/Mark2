<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark2</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Orbitron:500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
  </head>

  <body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-grid"></div>
            <div class="boot-core">
                <div class="boot-ring boot-ring-outer"></div>
                <div class="boot-ring boot-ring-arcs"></div>
                <div class="boot-ring boot-ring-ticks"></div>
                <div class="boot-progress"></div>
                <div class="boot-sweep"></div>
                <div class="loading-progress-text"></div>
            </div>
            <div class="boot-title">MARK2</div>
            <div class="boot-status">SYSTEM INITIALIZING</div>
            <div class="boot-bar"><span></span></div>
            <div class="boot-corner boot-corner-tl"></div>
            <div class="boot-corner boot-corner-tr"></div>
            <div class="boot-corner boot-corner-bl"></div>
            <div class="boot-corner boot-corner-br"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" });
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/FileSaveAs.js"></script>
  </body>
</html>
