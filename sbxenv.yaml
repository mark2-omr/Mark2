schemaVersion: "1"

# Choose the coding agent with: sbx env run --env-arg agent=claude .
args:
  agent:
    default: antigravity
    description: Coding agent kit name under docker.io/sbx/ (e.g. antigravity, claude, codex, shell)

agent: ${{ env.args.agent }}

# Sandbox name: mark2-<agent> (e.g. mark2-antigravity, mark2-claude)
name: mark2-${{ env.args.agent }}

# Mount the project directory (where this file lives) read/write
workspace: .

# Coding agent sandbox kit and .NET 11 SDK mixin (sbx/dotnet/dotnet.yaml, installed by an install hook)
kits:
  - docker.io/sbx/${{ env.args.agent }}:latest
  - ./sbx/dotnet

env:
  TZ: Asia/Tokyo
  ASPNETCORE_ENVIRONMENT: Development

# Publish the Blazor dev server (dotnet run --urls http://0.0.0.0:5130) on host port 5130
ports:
  - host: 5130
    sandbox: 5130
